<!-- {% load static %} -->

<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}کتابخانه{% endblock %}</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #f8f9fa;
      }

      main {
        flex: 1;
      }

      .navbar {
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }

      .navbar-brand {
        font-weight: bold;
        font-size: 1.3rem;
      }

      .search-box {
        width: 260px;
      }

      .search-box input {
        border-radius: 0 50px 50px 0;
      }

      .search-box button {
        border-radius: 50px 0 0 50px;
      }

      footer {
        background-color: white;
        border-top: 1px solid #dee2e6;
        color: #6c757d;
        font-size: 14px;
      }
      .category-select {
        height: 48px;
        border: 1px solid #dee2e6;
        border-radius: 12px;
        padding: 0 16px;
        font-size: 15px;
        font-weight: 500;
        background-color: #fff;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .category-select:hover {
        border-color: #86b7fe;
      }

      .category-select:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.12);
      }
      .login-card,
      .register-card {
        border-radius: 20px;
        overflow: hidden;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .login-card:hover,
      .register-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08) !important;
      }

      .login-card input,
      .register-card input {
        height: 48px;
        border-radius: 12px;
        border: 1px solid #dee2e6;
      }

      .login-card input:focus,
      .register-card input:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.12);
      }

      .login-card label,
      .register-card label {
        font-weight: 600;
        margin-bottom: 7px;
      }

      .login-card p,
      .register-card p {
        margin-bottom: 18px;
      }

      .login-icon,
      .register-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        background: #f1f3f5;
      }

      .login-btn,
      .register-btn {
        height: 50px;
        border-radius: 12px;
        font-weight: 600;
      }
    </style>

    {% block extra_css %}{% endblock %}
  </head>

  <body>
    <!-- ================= HEADER ================= -->
    <nav class="navbar navbar-expand-lg bg-white py-3">
      <div class="container">
        <!-- Logo -->
        <a class="navbar-brand text-primary" href="#"> 📚 کتابخانه </a>

        <!-- Center Buttons -->
        <div class="d-flex align-items-center gap-2 mx-auto">
          <!-- Books -->
          <a href="{% url 'book_list' %}" class="btn btn-outline-primary">
            مشاهده لیست کتاب‌ها
          </a>

          <!-- Add Book -->
          <a href="{% url 'create_book' %}" class="btn btn-primary">
            افزودن کتاب جدید
          </a>
          <!-- Add Book -->
          <a href="{% url 'create_category' %}" class="btn btn-primary">
            افزودن دسته بندی
          </a>

          <!-- Search -->
          <form
            method="get"
            action="{% url 'search'  %}"
            class="d-flex search-box"
          >
            <input
              type="search"
              name="q"
              class="form-control"
              placeholder="جستجوی کتاب..."
            />

            <button type="submit" class="btn btn-dark">🔍</button>
          </form>
        </div>

        <!-- Authentication -->
        <div class="d-flex gap-2">
          {% if user.is_authenticated %}
          <!-- 
          <span class="text-success"> سلام {{ user.username }} 👋 </span> -->

          <a
            href="{% url 'user_fav_books' user.id %}"
            class="btn btn-outline-primary"
          >
            کتاب های مورد علاقه
          </a>
          {% else %}

          <a href="{% url 'register' %}" class="btn btn-outline-primary">
            Register
          </a>

          <a href="{% url 'login' %}" class="btn btn-primary"> Login </a>

          {% endif %}
        </div>
      </div>
    </nav>

    <!-- ================= CONTENT ================= -->

    <main class="container py-4">{% block content %} {% endblock %}</main>

    <!-- ================= FOOTER ================= -->

    <footer class="py-3 text-center">
      ساخته شده با ❤️ توسط
      <strong>علی اصغر بلوچی</strong>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %} {% endblock %}
  </body>
</html>
