{% extends "book/base.html" %} {% block content %}

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-sm register-card">
        <div class="card-body p-5">
          <!-- Header -->
          <div class="text-center mb-4">
            <div class="register-icon">👤</div>

            <h2 class="fw-bold mt-3">ایجاد حساب کاربری</h2>

            <p class="text-muted">برای استفاده از کتابخانه ثبت نام کنید</p>
          </div>

          <form method="post">
            {% csrf_token %} {{ form.as_p }}

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary btn-lg register-btn">
                ثبت نام
              </button>
            </div>
          </form>

          <div class="text-center mt-4">
            <span class="text-muted"> قبلاً حساب ساخته‌اید؟ </span>

            <a href="{% url 'login' %}" class="text-decoration-none fw-bold">
              ورود
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
