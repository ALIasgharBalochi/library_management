{% extends "book/base.html" %}{% block content %}<section class="mx-auto max-w-2xl px-5 py-24"><div class="reveal rounded-[2.5rem] bg-white p-12 text-center shadow-xl">{% if error %}<div class="text-5xl">⚠</div><h1 class="mt-5 text-3xl font-black">فیلتری انتخاب نشده</h1><p class="mt-3 text-black/50">حداقل یکی از فیلترها را مشخص کن.</p>{% else %}<div class="text-5xl text-electric">✓</div><h1 class="mt-5 text-3xl font-black">عملیات با موفقیت انجام شد</h1><p class="mt-3 text-black/50">{{ count }} کتاب حذف شد.</p>{% endif %}<a href="{% url 'book_list' %}" class="mt-8 inline-block rounded-2xl bg-ink px-7 py-4 font-bold text-white">بازگشت به کتابخانه</a></div></section>{% endblock %}
