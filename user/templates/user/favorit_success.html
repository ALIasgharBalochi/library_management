{% extends "book/base.html" %} {% block content %}

<section class="relative overflow-hidden">
  <!-- Background Glow -->
  <div
    class="absolute right-[10%] top-20 h-72 w-72 rounded-full bg-electric/25 blur-[100px]"
  ></div>

  <div
    class="absolute bottom-10 left-[10%] h-60 w-60 rounded-full bg-electric/15 blur-[90px]"
  ></div>

  <!-- Content -->
  <div
    class="mx-auto flex min-h-[70vh] max-w-3xl items-center justify-center px-5 py-16"
  >
    <div
      class="reveal relative w-full rounded-[2.5rem] border border-black/5 bg-white p-8 text-center shadow-xl sm:p-14"
    >
      <!-- Success Icon -->
      <div
        class="mx-auto mb-7 grid h-24 w-24 place-items-center rounded-full bg-electric/15 text-5xl animate-pulse"
      >
        ❤️
      </div>

      <!-- Label -->
      <span class="text-xs font-black tracking-[.25em] text-black/40">
        BOOK ADDED
      </span>

      <!-- Title -->
      <h1 class="mt-3 text-3xl font-black tracking-tight sm:text-4xl">
        کتاب با موفقیت اضافه شد!
      </h1>

      <!-- Description -->
      <p
        class="mx-auto mt-5 max-w-xl text-sm leading-8 text-black/50 sm:text-base"
      >
        این کتاب با موفقیت به لیست کتاب‌های مورد علاقه شما اضافه شد.

        <br />

        حالا می‌توانید هر زمان که خواستید به کتاب مورد علاقه‌تان دسترسی داشته
        باشید.
      </p>

      <!-- Buttons -->
      <div class="mt-9 flex flex-wrap justify-center gap-3">
        <!-- Books -->
        <a
          href="{% url 'book_list' %}"
          class="rounded-2xl bg-ink px-7 py-4 font-bold text-white transition hover:-translate-y-1 hover:shadow-xl"
        >
          📚 مشاهده کتاب‌ها
        </a>

        <!-- Favorites -->
        <a
          href="{% url 'user_fav_books' user.id %}"
          class="rounded-2xl border border-black/10 bg-white px-7 py-4 font-bold transition hover:-translate-y-1 hover:border-black hover:shadow-lg"
        >
          ❤️ کتاب‌های مورد علاقه
        </a>
      </div>
    </div>
  </div>
</section>

{% endblock %}
