<!-- {% load static %} -->

<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}کتابخانه{% endblock %}</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #f8f9fa;
      }

      main {
        flex: 1;
      }

      .navbar {
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }

      .navbar-brand {
        font-weight: bold;
        font-size: 1.3rem;
      }

      .search-box {
        width: 260px;
      }

      .search-box input {
        border-radius: 0 50px 50px 0;
      }

      .search-box button {
        border-radius: 50px 0 0 50px;
      }

      footer {
        background-color: white;
        border-top: 1px solid #dee2e6;
        color: #6c757d;
        font-size: 14px;
      }
    </style>

    {% block extra_css %}{% endblock %}
  </head>

  <body>
    <!-- ================= HEADER ================= -->
    <nav class="navbar navbar-expand-lg bg-white py-3">
      <div class="container">
        <!-- Logo -->
        <a class="navbar-brand text-primary" href="#"> 📚 کتابخانه </a>

        <!-- Center Buttons -->
        <div class="d-flex align-items-center gap-2 mx-auto">
          <!-- Books -->
          <a href="{% url 'book_list' %}" class="btn btn-outline-primary">
            مشاهده لیست کتاب‌ها
          </a>

          <!-- Add Book -->
          <a href="{% url 'create_book' %}" class="btn btn-primary">
            افزودن کتاب جدید
          </a>

          <!-- Search -->
          <form
            method="get"
            action="{% url 'search'  %}"
            class="d-flex search-box"
          >
            <input
              type="search"
              name="q"
              class="form-control"
              placeholder="جستجوی کتاب..."
            />

            <button type="submit" class="btn btn-dark">🔍</button>
          </form>
        </div>

        <!-- Authentication -->
        <div class="d-flex gap-2">
          <a href="#" class="btn btn-outline-success"> Sign Up </a>

          <a href="#" class="btn btn-success"> Login </a>
        </div>
      </div>
    </nav>

    <!-- ================= CONTENT ================= -->

    <main class="container py-4">{% block content %} {% endblock %}</main>

    <!-- ================= FOOTER ================= -->

    <footer class="py-3 text-center">
      ساخته شده با ❤️ توسط
      <strong>علی اصغر بلوچی</strong>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %} {% endblock %}
  </body>
</html>
