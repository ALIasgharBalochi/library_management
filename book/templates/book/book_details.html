{% extends "book/base.html" %} {% block title %} جزئیات کتاب - {{ book.title }}
{% endblock %} {% block content %}

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-5">
          <!-- Title -->
          <div class="text-center mb-4">
            <div class="fs-1 mb-3">📚</div>

            <h1 class="fw-bold">{{ book.title }}</h1>

            <p class="text-muted">جزئیات کتاب</p>
          </div>

          <hr />

          <!-- Author -->
          <div class="d-flex justify-content-between align-items-center py-3">
            <span class="text-muted"> ✍️ نویسنده </span>

            <strong> {{ book.author }} </strong>
          </div>

          <!-- Pages -->
          <div class="d-flex justify-content-between align-items-center py-3">
            <span class="text-muted"> 📖 تعداد صفحات </span>

            <strong> {{ book.pages }} صفحه </strong>
          </div>

          <!-- Price -->
          <div class="d-flex justify-content-between align-items-center py-3">
            <span class="text-muted"> 💰 قیمت </span>

            <strong class="text-success"> {{ book.price }} تومان </strong>
          </div>

          <hr />

          <!-- Buttons -->
          <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'book_list' %}" class="btn btn-outline-secondary">
              ← بازگشت به لیست
            </a>
            <div>
              <a href="{% url 'delete_book' book.id %}" class="btn btn-danger">
                حذف کتاب
              </a>
              <a href="{% url 'update_book' book.id %}" class="btn btn-primary">
                ویرایش کتاب
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
