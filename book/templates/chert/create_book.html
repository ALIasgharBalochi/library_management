{% extends "book/base.html" %}{% block title %}افزودن کتاب{% endblock %}{% block content %}<section class="mx-auto max-w-3xl px-5 py-12"><div class="reveal rounded-[2.5rem] bg-white p-7 shadow-xl sm:p-12"><span class="text-xs font-black tracking-[.25em] text-black/40">NEW BOOK</span><h1 class="mt-2 text-4xl font-black">یک کتاب جدید اضافه کن</h1><form method="post" class="mt-9 grid gap-5">{% csrf_token %}{% for field in form %}<div><label class="mb-2 block text-sm font-bold">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="mt-2 text-xs text-red-600">{{ field.errors }}</div>{% endif %}</div>{% endfor %}<button class="mt-3 rounded-2xl bg-ink px-6 py-4 font-black text-white transition hover:-translate-y-1">ذخیره کتاب →</button></form></div></section>{% endblock %}
{% block extra_head %}<style>.form-control,.form-select{width:100%;border:1px solid rgba(0,0,0,.1);border-radius:1rem;padding:1rem;background:#fafafa;outline:none;transition:.2s}.form-control:focus,.form-select:focus{border-color:#A3FF12;box-shadow:0 0 0 4px rgba(163,255,18,.18)}</style>{% endblock %}
